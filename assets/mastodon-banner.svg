<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <g id="qnote">
      <ellipse cx="0" cy="30" rx="13" ry="10" transform="rotate(-16 0 30)"/>
      <rect x="10" y="-45" width="7" height="70" rx="3"/>
      <path d="
        M 17 -45
        C 34 -42, 46 -30, 47 -15
        C 47.5 -5, 41 3, 30 7
        C 36 -5, 34 -18, 26 -28
        C 22 -33, 19 -40, 17 -45
        Z
      "/>
    </g>
  </defs>

  <rect x="0" y="0" width="1500" height="500" fill="url(#bg)"/>

  <!-- scattered decorative notes, kept light so text stays legible -->
  <g fill="#ffffff" opacity="0.10">
    <use href="#qnote" transform="translate(90,120) scale(1.6)"/>
    <use href="#qnote" transform="translate(220,340) scale(1.1) rotate(10)"/>
    <use href="#qnote" transform="translate(1370,90) scale(1.3) rotate(-8)"/>
    <use href="#qnote" transform="translate(1290,300) scale(1.7) rotate(6)"/>
    <use href="#qnote" transform="translate(1440,420) scale(1.0)"/>
    <use href="#qnote" transform="translate(60,430) scale(1.2) rotate(-12)"/>
  </g>

  <!-- icon: speech bubble + eighth note -->
  <g transform="translate(150,90) scale(0.62)">
    <path d="
      M 106 128
      q 0 -32 32 -32
      h 236
      q 32 0 32 32
      v 168
      q 0 32 -32 32
      h -186
      l -58 56
      a 6 6 0 0 1 -10 -4
      l 4 -70
      h -18
      q -32 0 -32 -32
      z
    " fill="#ffffff"/>
    <g fill="url(#bg)">
      <ellipse cx="230" cy="248" rx="30" ry="22" transform="rotate(-16 230 248)"/>
      <rect x="253" y="128" width="16" height="122" rx="6"/>
      <path d="
        M 269 130
        C 302 136, 330 156, 332 182
        C 333 202, 320 218, 298 226
        C 310 206, 306 182, 292 162
        C 285 152, 277 141, 269 130
        Z
      "/>
    </g>
  </g>

  <!-- title block -->
  <g font-family="DejaVu Sans, sans-serif" fill="#ffffff">
    <text x="500" y="255" font-size="80" font-weight="bold">Song Quote Bot</text>
    <text x="503" y="305" font-size="28" opacity="0.92">AI-picked song lyric quotes, posted on a schedule</text>
  </g>
</svg>
